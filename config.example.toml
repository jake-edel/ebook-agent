# ebooks-agent configuration
#
# Copy this file to config.toml (which is gitignored) and change what you need.
# Every setting is optional: anything you leave out uses the default shown here.
#
# The agent reads config.toml next to ebooks_agent.py, or the file passed with
# --config PATH.
#
# Unknown sections or settings are an error, so typos don't go unnoticed.

[irc]
host = "irc.irchighway.net"
# Must be a TLS port: the connection always uses TLS (encrypt-only, see README)
port = 6697
nick: str = "anjay"
# What a /whois on us shows, besides the nick: the "user" part of
# nick!user@host, and the free-text real name. Left to irc3, these would
# announce us as "Irc bot based on irc3"
username: str = "anjay"
realname: str = "andrew_jacobs"
channel = "#ebooks"
# Seconds to wait for the connection and channel join at startup
connect_timeout = 30
# Log messages addressed to us: DMs, bot replies, DCC offers, server notices
show_private_messages = true

[downloads]
# Where books are saved. Relative paths are relative to this file; ~ works.
dir = "downloads"
# Where @search results files are saved (must differ from dir)
searches_dir = "searches"
# Largest file accepted, over DCC or extracted from a zip (max 4095)
max_size_mib = 100
# Refuse a download that would leave less free disk space than this
disk_headroom_mib = 512
# Seconds a bot has to offer the file, from when the search or book request
# is sent to the channel
offer_timeout = 60
# Seconds to wait for a bot to accept the DCC connection
connect_timeout = 15
# Give up on a transfer after this many seconds without data
stall_timeout = 30
