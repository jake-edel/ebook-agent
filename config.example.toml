# ebooks-agent configuration
#
# Copy this file to config.toml (which is gitignored) and change what you need.
# Every setting is optional: anything you leave out uses the default shown here.
#
# The agent reads config.toml next to ebooks_agent.py, or the file passed with
# --config PATH.
#
# Unknown sections or settings are an error, so typos don't go unnoticed.

[irc]
host = "irc.irchighway.net"
# Must be a TLS port: the connection always uses TLS (encrypt-only, see README)
port = 6697
nick = "anjay"
# What a /whois on you shows besides the nick: the "user" in nick!user@host
# (1-10 characters, no spaces) and a free-text real name
username = "anjay"
realname = "andrew_jacobs"
channel = "#ebooks"
# Seconds to wait for the connection and channel join at startup
connect_timeout = 30
# Log messages addressed to us: DMs, bot replies, DCC offers, server notices
show_private_messages = true

[downloads]
# Where books are saved. Relative paths are relative to this file; ~ works.
dir = "downloads"
# Where @search results files are saved (must differ from dir)
searches_dir = "searches"
# Largest file accepted, over DCC or extracted from a zip (max 4095)
max_size_mib = 100
# Refuse a download that would leave less free disk space than this
disk_headroom_mib = 512
# Seconds a bot has to offer the file, from when the search or book request
# is sent to the channel
offer_timeout = 60
# Book requests one bot may have from you at once, until each file has
# arrived. More wait their turn (1-10). Bots limit how many you may queue,
# and asking for more than that is rude
max_requests_per_bot = 2
# Seconds to wait for a bot to accept the DCC connection
connect_timeout = 15
# Give up on a transfer after this many seconds without data
stall_timeout = 30
# A command to run on each book once it's completely downloaded (not on
# searches), e.g. to move it into a library. A list: the command and its
# arguments, run directly, not through a shell. The book's path replaces an
# item that is exactly "{path}", or is added at the end if there's none, and
# is also in $EBOOK_PATH. Its output goes to the log file. If it fails, the
# book stays in `dir` and the failure is logged. Empty: no hook.
#
# For a watched folder (Calibre, Calibre-Web Automated), only a finished file
# may ever appear there. rsync writes to a temporary file first; --temp-dir
# keeps that out of the watched folder (it must exist, on the same
# filesystem, so the final step is a rename). To another machine:
#   on_complete = ["rsync", "--remove-source-files", "--timeout=60",
#                  "-e", "ssh -o BatchMode=yes",
#                  "--temp-dir=/mnt/hdd/downloads/.ebooks-incoming",
#                  "{path}", "me@example.org:/mnt/hdd/downloads/books/"]
# On the same machine, the same without -e and the "me@example.org:".
# BatchMode makes ssh fail rather than wait for a password: use a key.
on_complete = []
# Seconds the hook may run before it's killed
on_complete_timeout = 300

[log]
# The log file: what the agent sent to IRC, what was sent to it, and how each
# request went. Appended to across runs. Relative paths are relative to this
# file; ~ works. Created readable by you only.
file = "agent.log"
# Start a new file when this one reaches this size (1-1024)...
max_size_mib = 5
# ...keeping this many old ones as agent.log.1 (newest) to .3 (1-20)
backups = 3

[tui]
# The colour theme. "ansi-dark" (or "ansi-light") uses your terminal's own
# colours, so the TUI follows your terminal's theme. Or one of Textual's:
# textual-dark, textual-light, tokyo-night, gruvbox, nord, dracula, monokai,
# flexoki, solarized-dark, solarized-light, rose-pine, rose-pine-moon,
# rose-pine-dawn, catppuccin-mocha, catppuccin-macchiato, catppuccin-frappe,
# catppuccin-latte, atom-one-dark, atom-one-light
theme = "ansi-dark"
